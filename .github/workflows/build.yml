# ZHISHENG WEATHER TERMINAL // CI
name: Build // ASSEMBLE

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout // 检出
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unit tests // 单元测试
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android Lint // 静态检查
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Assemble debug // 构建调试包
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble public release // 构建公共发布包
        run: ./gradlew assemblePublicRelease --no-daemon --stacktrace
