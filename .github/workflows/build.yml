# ZHISHENG WEATHER TERMINAL // CI
name: 手动测试或打包

on:
  workflow_dispatch:
    inputs:
      task:
        description: 选择要执行的操作
        type: choice
        required: true
        options:
          - 测试
          - 打包

jobs:
  assemble:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout // 检出
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: 运行测试和代码检查
        if: inputs.task == '测试'
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: 构建 Android 安装包
        if: inputs.task == '打包'
        run: ./gradlew assembleDebug assemblePublicRelease --no-daemon --stacktrace
